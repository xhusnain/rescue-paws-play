<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No user-scalable: pinch-zoom would fight the pin taps. Orientation is never
     locked (design 1.4) - the renderer letterboxes into whatever shape exists. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Rescue Paws</title>

<!-- The Playables SDK MUST load before any game code (integration 1.1). -->
<script src="https://www.youtube.com/game_api/v1"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #FFE9D6;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="game.js"></script>
</body>
</html>
